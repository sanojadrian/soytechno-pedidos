<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;font-family:'IBM Plex Sans',Arial,sans-serif;background:#E6E2D8;display:flex;flex-direction:column}
.hd{background:#0E1A4A;color:#fff;padding:54px 16px 14px;display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;background:#F5B53F;color:#10162B;display:grid;place-items:center;font-weight:800}
.hd b{display:block;font-size:17px}.hd small{opacity:.8;font-size:13px}
.ch{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:10px;justify-content:flex-end}
.m{max-width:88%;background:#fff;border-radius:16px 16px 16px 4px;padding:11px 13px;font-size:15px;line-height:1.45;color:#10162B;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.m .t{display:block;text-align:right;font-size:11px;color:#8A90A8;margin-top:4px}
.btn{display:block;margin-top:10px;background:#2346D6;color:#fff;text-align:center;border-radius:12px;padding:11px;font-weight:700}
.bar{background:#F2F3EF;padding:10px 12px 28px;display:flex;gap:8px}.bar span{flex:1;background:#fff;border-radius:20px;padding:10px 14px;color:#8A90A8;font-size:14px}
</style></head><body>
<div class="hd"><div class="av">S</div><div><b>Soytechno</b><small>Asistente de pedidos</small></div></div>
<div class="ch">
<div class="m" style="display:none">¡Hola María! 👋 Recibimos tu pedido Cashea <b>#241157548</b>: Samsung Galaxy A16 4G 4GB/128GB.<br>Inicial 20%: <b>$40,00</b>.<span class="t">10:42</span></div>
<div class="m" style="display:none">Elige cómo recibirlo y paga tu inicial aquí 👇<span class="btn">Elegir entrega y pagar</span><span class="t">10:42</span></div>
</div>
<div class="bar"><span>Mensaje</span></div>
<div id="ty" class="m" style="display:none;width:64px">•••</div>
<script>window.mostrar=async()=>{const ms=[...document.querySelectorAll('.m')].filter(m=>m.id!=='ty'),ty=document.getElementById('ty'),ch=document.querySelector('.ch');for(const m of ms){ch.appendChild(ty);ty.style.display='block';await new Promise(r=>setTimeout(r,650));ty.style.display='none';ch.insertBefore(m,ty);m.style.display='block';m.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:320,easing:'ease-out'});await new Promise(r=>setTimeout(r,500))}}</script></body></html>
