<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css?v=2">
<title>Soytechno · Entrar</title>
</head>
<body>
<main class="login">
  <form id="f" novalidate>
    <div class="brandbar"><img src="assets/logo-white.png" alt="Soytechno" width="150" height="20"><span>Pedidos Cashea</span></div>
    <h1 style="font-size:26px">Entrar</h1>
    <div class="field"><label for="correo">Correo</label><input type="email" id="correo" autocomplete="username" required></div>
    <div class="field"><label for="clave">Clave</label><input type="password" id="clave" autocomplete="current-password" required></div>
    <p class="err" id="err" role="alert" hidden></p>
    <button class="btn block" type="submit" id="btn">Entrar</button>
    <p class="note">¿Olvidaste tu clave? Pídele a Supervisión que te asigne una nueva.</p>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js" integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT" crossorigin="anonymous"></script>
<script src="assets/config.js?v=2"></script>
<script src="assets/common.js?v=2"></script>
<script src="assets/login.js?v=2"></script>
</body>
</html>
